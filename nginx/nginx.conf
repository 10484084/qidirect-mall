# 生产入口：HTTPS 终结 + 静态托管 + 接口转发
# 证书目录 ./nginx/certs 以只读方式挂载（cert.pem / key.pem，或按实际文件名替换下方 ssl_certificate）。

# 容器重建后 IP 会变，用 Docker 内置 DNS 动态解析，避免 upstream 缓存旧 IP 导致 502
resolver 127.0.0.11 valid=10s ipv6=off;

# 静态资源压缩：JS/CSS 体积可降 70% 以上，显著缩短后台首屏加载
gzip on;
gzip_comp_level 6;
gzip_min_length 1024;
gzip_vary on;
gzip_proxied any;
gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/rss+xml font/truetype font/opentype application/vnd.ms-fontobject image/svg+xml;


# 手机访问桌面后台时自动跳转到移动版；带 ?desktop=1 可强制留在桌面版（移动版「切换电脑版」入口使用）
map $http_user_agent $is_mobile {
    default 0;
    ~*(Android|iPhone|iPod|Mobile|HarmonyOS|MiuiBrowser) 1;
}

map "$is_mobile:$arg_desktop" $mobile_redirect {
    default 0;
    "1:"  1;
    "1:0" 1;
}

upstream mall_admin {
    zone mall_admin 64k;
    server mall-admin:8080 resolve;
}

upstream mall_api {
    zone mall_api 64k;
    server mall-api:8081 resolve;
}

# HTTP：仅用于证书续期校验与跳转 HTTPS
server {
    listen 80;
    server_name _;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    client_max_body_size 10m;

    # 门店端 H5（构建产物挂载到 /usr/share/nginx/html/h5）
    location /h5/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /h5/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # 厂家端后台（构建产物挂载到 /usr/share/nginx/html/admin-web）
    location /admin-web/ {
        if ($mobile_redirect) {
            return 302 /admin-m/;
        }
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /admin-web/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # 厂家端后台移动版（构建产物挂载到 /usr/share/nginx/html/admin-m）
    location = /admin-m {
        return 301 /admin-m/;
    }

    location /admin-m/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /admin-m/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # 支付 bridge 页（公众号授权回跳 → 扫呗 JSAPI），对应 WX_BRIDGE_URL
    location = /pay-bridge {
        return 301 /pay-bridge/;
    }

    location /pay-bridge/ {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /pay-bridge/index.html;
        add_header Cache-Control "no-cache" always;
    }

    # 静态资源长缓存（文件名带 hash）
    location ~* ^/(h5|admin-web|admin-m)/assets/ {
        root /usr/share/nginx/html;
        expires 30d;
        add_header Cache-Control "public, immutable" always;
    }

    # 后台文件（本地存储模式）：直接由后端提供，生产切换 OSS 后可删除
    location /files/ {
        proxy_pass http://mall_admin;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /admin/ {
        proxy_pass http://mall_admin;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    location /api/ {
        proxy_pass http://mall_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # 接口文档与健康检查不对公网暴露
    location = /admin/health {
        allow 127.0.0.1;
        deny all;
        proxy_pass http://mall_admin;
    }

    location / {
        return 404;
    }
}
