# ===== 生产环境配置（mall-api，门店端）=====
# 中间件部署在同一台服务器（docker compose 网络，服务名即主机名）
spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:qidirect_mall}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: ${DB_USER:root}
    password: ${DB_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST:redis}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      database: 0

# 生产环境文件上传走本地存储，上传目录由 compose 挂载持久化
storage:
  type: local
  local-dir: ${STORAGE_LOCAL_DIR:/app/uploads}
  public-url: /files

sms:
  provider: ${SMS_PROVIDER:mock}

payment:
  provider: ${PAYMENT_PROVIDER:mock}

# 生产关闭接口文档
knife4j:
  enable: false

springdoc:
  api-docs:
    enabled: false

logging:
  level:
    root: warn
    com.qidirect.mall: info
