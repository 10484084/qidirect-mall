name: qidirect-mall

x-app-env: &app-env
  TZ: Asia/Shanghai
  DB_HOST: mysql
  DB_PORT: "3306"
  DB_NAME: ${DB_NAME:-qidirect_mall}
  DB_USER: root
  DB_PASSWORD: ${DB_PASSWORD:-root}
  REDIS_HOST: redis
  REDIS_PORT: "6379"
  REDIS_PASSWORD: ${REDIS_PASSWORD:-mallredis}
  JWT_SECRET: ${JWT_SECRET:-qidirect-mall-dev-secret-please-change-32chars}
  AES_KEY: ${AES_KEY:-qidirect-mall-aes-key-32-bytes!!}
  HASH_SALT: ${HASH_SALT:-qidirect-mall-hash-salt}
  INVITE_BASE_URL: ${INVITE_BASE_URL:-https://mall.example.com/register}
  STORAGE_TYPE: ${STORAGE_TYPE:-local}
  STORAGE_PUBLIC_URL: ${STORAGE_PUBLIC_URL:-/files}
  OSS_ENDPOINT: ${OSS_ENDPOINT:-}
  OSS_BUCKET: ${OSS_BUCKET:-}
  OSS_ACCESS_KEY: ${OSS_ACCESS_KEY:-}
  OSS_SECRET: ${OSS_SECRET:-}
  OSS_PUBLIC_URL: ${OSS_PUBLIC_URL:-}
  SMS_PROVIDER: ${SMS_PROVIDER:-mock}
  SMS_ACCESS_KEY: ${SMS_ACCESS_KEY:-}
  SMS_SECRET: ${SMS_SECRET:-}
  SMS_SIGN: ${SMS_SIGN:-}
  SMS_TEMPLATE_CODE: ${SMS_TEMPLATE_CODE:-}
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-mock}
  SAOBEI_MERCHANT_NO: ${SAOBEI_MERCHANT_NO:-}
  SAOBEI_TERMINAL_ID: ${SAOBEI_TERMINAL_ID:-}
  SAOBEI_ACCESS_TOKEN: ${SAOBEI_ACCESS_TOKEN:-}
  SAOBEI_API_BASE: ${SAOBEI_API_BASE:-https://pay.lcsw.cn/lcsw/pay}
  SAOBEI_SERVICE_ID: ${SAOBEI_SERVICE_ID:-}
  WX_APPID: ${WX_APPID:-}
  WX_SECRET: ${WX_SECRET:-}

services:
  nginx:
    image: nginx:1.27-alpine
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
      - ./frontend-dist:/usr/share/nginx/html:ro
    depends_on:
      - mall-admin
      - mall-api

  # 一次性构建前端静态资源到 ./frontend-dist，需显式执行：
  #   docker compose run --rm frontend
  frontend:
    profiles: ["build"]
    build:
      context: .
      dockerfile: Dockerfile.frontend
    volumes:
      - ./frontend-dist:/dist

  mall-admin:
    build:
      context: .
    image: mall:1.0
    restart: always
    environment:
      <<: *app-env
      SERVER_PORT: "8080"
      SPRING_PROFILES_ACTIVE: prod
      STORAGE_LOCAL_DIR: /app/uploads
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mall-api:
    image: mall:1.0
    restart: always
    command: ["/app/mall-api.jar"]
    environment:
      <<: *app-env
      SERVER_PORT: "8081"
      SPRING_PROFILES_ACTIVE: prod
      STORAGE_LOCAL_DIR: /app/uploads
    ports:
      - "127.0.0.1:8081:8081"
    volumes:
      - ./uploads:/app/uploads
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mall-job:
    image: mall:1.0
    restart: always
    command: ["/app/mall-job.jar"]
    environment:
      <<: *app-env
      SPRING_PROFILES_ACTIVE: job,prod
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started

  mysql:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_NAME:-qidirect_mall}
      TZ: Asia/Shanghai
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - ./mysql-data:/var/lib/mysql
      - ./mysql-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${DB_PASSWORD:-root}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7
    restart: always
    environment:
      TZ: Asia/Shanghai
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD:-mallredis}"]
    ports:
      - "127.0.0.1:6379:6379"
